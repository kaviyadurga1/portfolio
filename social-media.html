<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media</title>
    <link
      rel="shortcut icon"
      type="image/icon"
      href="assets/images/about/website-logo.svg"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        margin-bottom: 20px;;
        padding: 0;
        background-color: black;
        color: white;
      }

      .section-title {
        font-family: "Dancing Script", cursive; /* Elegant, flowing handwritten font */
        font-weight: normal; /* Keep the natural look */
        font-size: 50px; /* Large size for impact */
        color: #3498db; /* Soft, elegant purple #8e44ad;*/
        text-align: center; /* Center the title */
        margin: 30px 0; /* Margin for spacing */
        letter-spacing: 1px; /* Light letter spacing for readability */
        line-height: 1.3; /* Slight line height to keep it clean */
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2); /* Subtle shadow for depth */
      }
      /* Navigation */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #ffffff;
        padding: 15px 20px;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
        z-index: 1000;
      }

      .navbar .title {
        margin-left: 30px;
        color: #269dd1;
        font-size: 20px;
        font-weight: bold;
      }

      .nav-buttons {
        display: flex;
        gap: 10px;
        margin-right: 40px;
      }

      .dropbtn {
        background-color: #ffffff;
        color: rgb(0, 0, 0);
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
      }

      .dropbtn a {
        text-decoration: none;
        color: #151617;
      }

      .container {
        max-width: 1500px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      p {
        text-align: left;
        margin-bottom: 20px;
        color: #666;
      }

      .portfolio-filters {
        margin-bottom: 20px;
      }

      .portfolio-filters a {
        margin-right: 15px;
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
      }

      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
      }

      .portfolio-item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .portfolio-item img {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.3s ease;
      }

      .section{
        margin-top: 100px;
        margin-left: 20px;
        margin-right: 20px;
      }

      .story{
        width: 100%;
        height: 100%;
      }

      .blog{
        width: 550px;
        height: 800px;
      }
    </style>
    <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap"
    rel="stylesheet"
  />
  </head>
  <body>
    <div class="navbar">
      <div class="title">SOCIAL MEDIA</div>
      <div class="nav-buttons">
        <button class="dropbtn">
          <a href="#posts">AD-POSTS</a>
        </button>
        <button class="dropbtn">
          <a href="#stories">AD-STORIES</a>
        </button>
        <button class="dropbtn">
          <a href="#Blogs">BLOGS</a>
        </button>
      </div>
    </div>
    <section class="section" id="posts">
      <div>
        <h1 class="section-title">Instagram / Facebook Posts</h1>
        <br />
  
        <div class="portfolio-grid">

          <div class="portfolio-item">
            <img
              src="assets/images/portfolio/projects/social-media/post/car-ad-post.jpg"
              alt="post 3"
            />
          </a>
        </div>

          <div class="portfolio-item">
              <img
                src="assets/images/portfolio/projects/social-media/post/tshirt-ad-post.jpg"
                alt="post 1"
              />
            </a>
          </div>
  
          <div class="portfolio-item">
              <img
                src="assets/images/portfolio/projects/social-media/post/funiture-post.jpg"
                alt="post 2"
              />
            </a>
          </div>
  
          

          <div class="portfolio-item">
              <img
                src="assets/images/portfolio/projects/social-media/post/waffle-post.jpg"
                alt="post 4"
              />
            </a>
          </div>
  
          </div>
    </section>

    <section class="section" id="stories">
      <div>
        <h1 class="section-title">Digital Ads / posters</h1>
        <br />
  
        <div class="portfolio-grid">  

              <div class="portfolio-item story">
                <img
                  src="assets/images/portfolio/projects/social-media/story/travel-ad.png"
                  alt="poster 1"
                />
              </a>
              </div>

              <div class="portfolio-item story">
                <img
                  src="assets/images/portfolio/projects/social-media/story/music-party-flyer.png"
                  alt="poster 2"
                />
              </a>
              </div>
              <div class="portfolio-item story">
                <img
                  src="assets/images/portfolio/projects/social-media/story/burger-ad.png"
                  alt="poster 3"
                />
              </a>
              </div>
  
              <div class="portfolio-item story">
                <img
                  src="assets/images/portfolio/projects/social-media/story/cafe-ad.png"
                  alt="poster 4"
                />
              </a>
              </div>

              <div class="portfolio-item story">
                <img
                  src="assets/images/portfolio/projects/social-media/story/perfume-poster.jpg"
                  alt="poster 5"
                />
              </a>
            </div>
              <div class="portfolio-item story">
                <img
                  src="assets/images/portfolio/projects/social-media/story/bar-flyer.jpg"
                  alt="poster 6"
                />
              </a>
              </div>

              
          </div>
    </section>
    <section class="section" id="Blogs">
      <div>
        <h1 class="section-title">Blogs</h1>
        <br />
  
        <div class="portfolio-grid">  
           <div class="portfolio-item blog">
              <img
                src="assets/images/portfolio/projects/social-media/blog/construction-app.jpg"
                alt="story 1"
              />
            </a>
            </div>
          </div>
    </section>
  </body>
  </body>
</html>
