        .navbar {

      .section-title {
        font-family: "Dancing Script", cursive; /* Elegant, flowing handwritten font */
        font-weight: normal; /* Keep the natural look */
        font-size: 50px; /* Large size for impact */
        color: #3498db; /* Soft, elegant purple #8e44ad;*/

      .portfolio-filters {
        margin-bottom: 20px;

      .portfolio-filters a {
        margin-right: 15px;
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
      }

      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
      }

      .portfolio-item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .portfolio-item img {
        width: 100%;
        height: 100%;
        max-height: 450px;
        display: block;
        transition: transform 0.3s ease;
      }


      .poster-filters {
    margin-bottom: 20px;
}

.poster-filters a {
    margin-right: 15px;
    text-decoration: none;
    color: #007bff;
    font-weight: bold;
}

.poster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Auto-fit adjusts based on screen size */
    gap: 20px;
    justify-content: center;
    align-items: center;
}

/* Ensures proper scaling of images */
.poster-item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
}

.poster-item img {
    width: 100%;
    height: auto;
    max-height: 200px; /* Prevents image from being too tall */
    object-fit: cover; /* Ensures images cover the area without distortion */
    transition: transform 0.3s ease;
}

/* Section spacing */
.section {
    margin-top: 80px;
    margin-left: 20px;
    margin-right: 20px;
}

/* Adjusts image height for better responsiveness
.story {
    width: 100%;
    max-width: 100%;
    height: auto; 
    max-height: 600px;
} */

/* ✅ Mobile-Friendly Adjustments */
@media (max-width: 768px) {
    .poster-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Adjust for smaller screens */
        gap: 15px;
    }

    .poster-item img {
        max-height: 400px; /* Reduce height for mobile */
    }

    .section {
        margin-top: 50px;
        margin-left: 10px;
        margin-right: 10px;
    }
}

@media (max-width: 480px) {
    .poster-grid {
        grid-template-columns: 1fr; /* Single column layout for small screens */
    }

    .poster-item img {
        max-height: 300px; /* Further reduce height for smaller screens */
    }
}

.blog-grid {
  display: grid;
  
  gap: 20px;
}

.blog-item {
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.blog-item img {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform 0.3s ease;
}
