<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branding</title>
    <link
      rel="shortcut icon"
      type="image/icon"
      href="assets/images/about/website-logo.svg"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      p {
        text-align: left;
        margin-bottom: 20px;
        color: #666;
      }

      .portfolio-filters {
        margin-bottom: 20px;
      }

      .portfolio-filters a {
        margin-right: 15px;
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
      }

      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
        gap: 20px;
      }

      .portfolio-item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .portfolio-item img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.3s ease;
      }

      .portfolio-item:hover img {
        transform: scale(1.1);
      }

      .portfolio-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        color: white;
        font-size: 1.2rem;
        text-transform: uppercase;
      }

      .portfolio-item:hover .portfolio-overlay {
        opacity: 1;
      }

      .rectangle {
        width: 600px;
        height: 400px;
      }

      .rectangle-small {
        width: 600px;
        height: 300px;
      }

      .portrait {
        width: 300px;
        height: 500px;
      }

      .section-title {
        font-family: "Dancing Script", cursive; /* Elegant, flowing handwritten font */
        font-weight: normal; /* Keep the natural look */
        font-size: 50px; /* Large size for impact */
        color: #3498db; /* Soft, elegant purple #8e44ad;*/
        text-align: center; /* Center the title */
        margin: 30px 0; /* Margin for spacing */
        letter-spacing: 1px; /* Light letter spacing for readability */
        line-height: 1.3; /* Slight line height to keep it clean */
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2); /* Subtle shadow for depth */
      }
    </style>
    <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap"
    rel="stylesheet"
  />
  </head>
  <body>
    <div class="container">
      <h1 class="section-title">Branding</h1>
      <br />

      <div class="portfolio-grid">
        <div class="portfolio-item rectangle">
          <!-- <a
            href="https://www.figma.com/design/awCTgG2ObsSAlYHx98DO2Y/mockups?node-id=0-1&t=qXlvGJhOd1ZitXhY-1"
          > -->
            <img
              src="assets/images/portfolio/projects/mockups/cosmetic-mockup.jpg"
              alt="mockup 1"
            />
            <!-- <div class="portfolio-overlay">View Project</div> -->
          </a>
        </div>


        <div class="portfolio-item rectangle">
          <!-- <a
            href="https://www.figma.com/design/awCTgG2ObsSAlYHx98DO2Y/Untitled?node-id=3-22&t=vhfMaUzZpDGiJ4GV-1"
          > -->
            <img
              src="assets/images/portfolio/projects/mockups/Business-updated.jpg"
              alt="mockup 3"
            />
            <!-- <div class="portfolio-overlay">View Project</div> -->
          </a>
        </div>

        <div class="portfolio-item rectangle-small">
          <!-- <a
            href="https://www.canva.com/design/DAGceugLu8w/i403kMBQjHnrxyvL_oyxKA/view?utm_content=DAGceugLu8w&utm_campaign=share_your_design&utm_medium=link&utm_source=shareyourdesignpanel"
            target="_blank"
          > -->
            <img
              src="assets/images/portfolio/projects/mockups/product-sticker-mockup.jpg"
              alt="mockup 4"
            />
            <!-- <div class="portfolio-overlay">
              <span>View Project</span>
            </div> -->
          </a>
        </div>

        <div class="portfolio-item portrait">
          <!-- <a
            href="https://www.figma.com/design/awCTgG2ObsSAlYHx98DO2Y/Untitled?node-id=3-17&t=vhfMaUzZpDGiJ4GV-1"
            target="_blank"
          > -->
            <img
              src="assets/images/portfolio/projects/mockups/banner-clothing-brand.jpg"
              alt="mockup 5"
            />
            <!-- <div class="portfolio-overlay">View Project</div> -->
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
