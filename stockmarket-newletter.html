<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Market Newsletter</title>
    <link
      rel="shortcut icon"
      type="image/icon"
      href="assets/images/about/website-logo.svg"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: flex;  /* Use 100vh for full screen height */
  background-color: #000000;
}

.image-container {
  width: 100%;
  text-align: center; /* Center the content inside the container */
}

.image {
  width: 100%;
  height: auto;
  display: block;
  margin: 0 auto; /* Center images within their container */
}

.first-image {
  width: 600px;
  height: 1000px;
  margin-bottom: 20px; /* Adjust spacing between images */
}

.second-third-row {
  display: flex;
  justify-content: center; /* Center the images side by side */
  margin-bottom: 20px; /* Space between second/third row and last row */
}

.second-image, .third-image {
  width: 600px; /* Set width of second and third images */
  height: 1000px;
  margin: 0; /* Remove any margin between second and third image */
}


.fourth-image {
  width: 600px;
  height: 1000px;
  margin-top: 20px; /* Space between the third and fourth row */
}

  </style>
<body>
  <div class="image-container">
    <img src="assets/images/portfolio/projects/editorial-design/newsletters/stock-newsletter/1.jpg" alt="Image 1" class="image first-image">
    <div class="second-third-row">
      <img src="assets/images/portfolio/projects/editorial-design/newsletters/stock-newsletter/2.jpg" alt="Image 2" class="image second-image">
      <img src="assets/images/portfolio/projects/editorial-design/newsletters/stock-newsletter/3.jpg" alt="Image 3" class="image third-image">
    </div>
    <img src="assets/images/portfolio/projects/editorial-design/newsletters/stock-newsletter/4.jpg" alt="Image 4" class="image fourth-image">
  </div>


      </body>
    </html>
  </body>
</html>
